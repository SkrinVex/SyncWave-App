name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*", "v*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Project Root
        id: proj
        run: |
          if [ -f "gradlew" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
            echo "app_dir=app" >> $GITHUB_OUTPUT
          elif [ -f "SyncWave App/gradlew" ]; then
            echo "dir=SyncWave App" >> $GITHUB_OUTPUT
            echo "app_dir=SyncWave App/app" >> $GITHUB_OUTPUT
          else
            echo "Could not find gradlew!"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            # Generate numeric versionCode from semantic version (e.g. 1.2.3 -> 10203)
            IFS='.' read -r -a PARTS <<< "$VERSION"
            MAJOR="${PARTS[0]:-1}"
            MINOR="${PARTS[1]:-0}"
            PATCH="${PARTS[2]:-0}"
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "version_name=$VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$CODE" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version_name=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p "${{ steps.proj.outputs.app_dir }}"
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ steps.proj.outputs.app_dir }}/release-keystore.jks"
            echo "KEYSTORE_EXISTS=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x "${{ steps.proj.outputs.dir }}/gradlew"

      - name: Build Signed Release APK
        if: env.KEYSTORE_EXISTS == 'true'
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_FILE=release-keystore.jks \
            -PKEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PKEY_ALIAS="$KEY_ALIAS" \
            -PKEY_PASSWORD="$KEY_PASSWORD" \
            -PversionName="${{ steps.versioning.outputs.version_name }}" \
            -PversionCode="${{ steps.versioning.outputs.version_code }}" \
            --no-daemon

      - name: Build Debug APK (Fallback if Keystore not provided)
        if: env.KEYSTORE_EXISTS != 'true'
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          ./gradlew assembleDebug \
            -PversionName="${{ steps.versioning.outputs.version_name }}" \
            -PversionCode="${{ steps.versioning.outputs.version_code }}" \
            --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          APK_FILE=$(find . -type f -name "app-release.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "app-debug.apk" | head -n 1)
          fi
          
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            cp "$APK_FILE" "dist/syncwave-app-${{ steps.versioning.outputs.version_name }}.apk"
            cp "$APK_FILE" "dist/syncwave-app-latest.apk"
          else
            echo "Error: No APK file generated!"
            exit 1
          fi

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncwave-app-${{ steps.versioning.outputs.version_name }}
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release and Publish APK Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "SyncWave App ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/syncwave-app-${{ steps.versioning.outputs.version_name }}.apk
            dist/syncwave-app-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
