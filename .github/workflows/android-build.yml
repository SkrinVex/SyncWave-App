name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*", "v*" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Sign Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            # Generate numeric versionCode from semantic version (e.g. 1.2.3 -> 10203)
            IFS='.' read -r -a PARTS <<< "$VERSION"
            MAJOR="${PARTS[0]:-1}"
            MINOR="${PARTS[1]:-0}"
            PATCH="${PARTS[2]:-0}"
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "version_name=$VERSION" >> $GITHUB_OUTPUT
            echo "version_code=$CODE" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version_name=dev-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode Android Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks
          echo "KEYSTORE_EXISTS=true" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        if: env.KEYSTORE_EXISTS == 'true'
        run: |
          ./gradlew assembleRelease \
            -PKEYSTORE_FILE=release-keystore.jks \
            -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
            -PversionName="${{ steps.versioning.outputs.version_name }}" \
            -PversionCode="${{ steps.versioning.outputs.version_code }}" \
            --no-daemon

      - name: Build Debug APK (Fallback if Keystore not provided)
        if: env.KEYSTORE_EXISTS != 'true'
        run: |
          ./gradlew assembleDebug \
            -PversionName="${{ steps.versioning.outputs.version_name }}" \
            -PversionCode="${{ steps.versioning.outputs.version_code }}" \
            --no-daemon

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "dist/syncwave-app-${{ steps.versioning.outputs.version_name }}.apk"
            cp "app/build/outputs/apk/release/app-release.apk" "dist/syncwave-app-latest.apk"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "dist/syncwave-app-${{ steps.versioning.outputs.version_name }}-debug.apk"
            cp "app/build/outputs/apk/debug/app-debug.apk" "dist/syncwave-app-latest.apk"
          fi

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncwave-app-${{ steps.versioning.outputs.version_name }}
          path: dist/*.apk
          retention-days: 30

      - name: Create GitHub Release and Publish APK Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "SyncWave App ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/syncwave-app-${{ steps.versioning.outputs.version_name }}.apk
            dist/syncwave-app-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

